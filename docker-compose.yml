# Base stack. Services are added step by step (see docs/build-plan.md):
# step 6 mlflow+postgres, step 8 airflow, step 11 serving, step 13 prometheus/pushgateway/grafana.
# Host ports avoid 80/5432/5433/8000, which other local projects use.
name: credit-drift

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: only other services on the compose network talk to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops}"]
      interval: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    environment:
      MLFLOW_BACKEND_URI: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: /mlartifacts
      # Host names MLflow answers to (it rejects others as DNS rebinding); add the public name on AWS.
      MLFLOW_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mlflow:*
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 12

  serving:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: credit_scoring
      MODEL_ALIAS: champion
      RELOAD_TOKEN: ${RELOAD_TOKEN:-dev-reload-token}  # set a real secret anywhere but a laptop
    ports:
      - "127.0.0.1:8010:8000"  # 8000 belongs to another local project
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  mlartifacts:
