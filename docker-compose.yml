# Base stack. Services are added step by step (see docs/build-plan.md):
# step 6 mlflow+postgres, step 8 airflow, step 11 serving, step 13 prometheus/pushgateway/grafana.
# Host ports avoid 80/5432/5433/8000, which other local projects use.
name: credit-drift

# Shared by every Airflow service. The container runs as the host user (AIRFLOW_UID, 1000 on the box) so files it
# writes into the bind mounts (artifacts, reports, data) belong to you, not to root.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: credit-drift-airflow
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Dev defaults: fine behind the SSH tunnel on a private box; put real secrets in the box's .env before sharing.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-QWzCl9U6zEe0uoxTrfPGffyLkHvL9G9fMTS0I67Q3Dc=}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-jwt-secret-change-me-before-sharing-anything}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET:-dev-api-secret-change-me-before-sharing-anything}
    # The UI listens on 127.0.0.1 only and is reached through the SSH tunnel, so the SSH key is the login.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    # What the DAG tasks talk to (compose network names)
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_SERVER_URL: http://serving:8000
    PUSHGATEWAY_URL: http://pushgateway:9091
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/credit-drift/src
    - ./config:/opt/credit-drift/config
    - ./data:/opt/credit-drift/data
    - ./artifacts:/opt/credit-drift/artifacts
    - ./reports:/opt/credit-drift/reports
    - ./gx:/opt/credit-drift/gx

services:
  postgres:
    restart: ${RESTART_POLICY:-no}  # the Linux box sets unless-stopped in its .env
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: only other services on the compose network talk to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops}"]
      interval: 5s
      retries: 10

  mlflow:
    restart: ${RESTART_POLICY:-no}  # the Linux box sets unless-stopped in its .env
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    environment:
      MLFLOW_BACKEND_URI: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: /mlartifacts
      # Host names MLflow answers to (it rejects others as DNS rebinding); add the public name on AWS.
      MLFLOW_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mlflow:*
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 12

  serving:
    restart: ${RESTART_POLICY:-no}  # the Linux box sets unless-stopped in its .env
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: credit_scoring
      MODEL_ALIAS: champion
      RELOAD_TOKEN: ${RELOAD_TOKEN:-dev-reload-token}  # set a real secret anywhere but a laptop
    ports:
      - "127.0.0.1:8010:8000"  # 8000 belongs to another local project
    depends_on:
      mlflow:
        condition: service_healthy

  # ---- Airflow (profile "airflow": the Linux box sets COMPOSE_PROFILES=airflow in its .env; the laptop does not) ----
  airflow-postgres:
    restart: ${RESTART_POLICY:-no}  # the Linux box sets unless-stopped in its .env
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflowdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: airflow db migrate
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: airflow api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 15s
      retries: 10
    restart: ${RESTART_POLICY:-no}

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: ${RESTART_POLICY:-no}

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: ${RESTART_POLICY:-no}

  # ---- Metrics (profile "monitoring"): the DAG pushes to the Pushgateway, Prometheus scrapes it and the model server ----
  pushgateway:
    image: prom/pushgateway:v1.11.1
    profiles: ["monitoring"]
    restart: ${RESTART_POLICY:-no}
    ports:
      - "127.0.0.1:9091:9091"

  prometheus:
    image: prom/prometheus:v3.5.1
    profiles: ["monitoring"]
    restart: ${RESTART_POLICY:-no}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - pushgateway

volumes:
  pgdata:
  mlartifacts:
  airflowdb:
  airflow_logs:
  prometheusdata:
