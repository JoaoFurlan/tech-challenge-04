# Prometheus for the monitoring loop. Two collection patterns, on purpose:
#   push: the Airflow DAG is a short-lived batch job, so it pushes its weekly metrics to the Pushgateway, and
#         Prometheus scrapes the Pushgateway (honor_labels keeps the week/stage labels the DAG chose);
#   pull: the model server is long-running, so Prometheus scrapes its /metrics directly.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: model-server
    metrics_path: /metrics
    static_configs:
      - targets: ["serving:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
