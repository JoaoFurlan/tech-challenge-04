[project]
name = "credit-drift"
version = "0.1.0"
description = "Reliability layer (contracts, drift, observability, governance) around a credit-scoring model"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "pandas>=2.2,<3",  # evidently 0.7 breaks on pandas 3
    "numpy",
    "scikit-learn",
]

# Heavier stacks live in groups so each container installs only what it needs.
[dependency-groups]
dev = ["pytest", "ruff", "dvc[s3]", "matplotlib", "jupyterlab", "ipykernel"]
training = ["pyarrow", "mlflow", "optuna", "xgboost", "lightgbm"]
validation = ["pandera", "great-expectations"]
monitoring = ["pyarrow", "evidently", "prometheus-client", "requests"]
mlflow-server = ["mlflow", "psycopg2-binary"]
serving = ["fastapi", "uvicorn", "mlflow-skinny", "prometheus-client"]

[tool.uv]
default-groups = ["dev", "training", "validation", "monitoring"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_drift"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
